name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OUI_URL: https://standards-oui.ieee.org/oui/oui.csv

jobs:
  windows-exe:
    name: Build wifi-scanner.exe
    runs-on: windows-latest
    permissions:
      contents: write # required to attach the executable to a release
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Smoke-test the script
        run: |
          python -c "import wifi_scanner"
          python wifi_scanner.py --help

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Fetch the IEEE OUI registry for bundling
        continue-on-error: true # branch builds still produce a working exe
        shell: pwsh
        run: |
          curl.exe -fsSL --retry 5 --retry-all-errors --retry-delay 5 `
            --max-time 300 -A "wifi-scanner/1.0" -o oui.csv "$env:OUI_URL"
          "oui.csv: $((Get-Item oui.csv).Length) bytes"

      - name: Build
        run: python build.py

      - name: Smoke-test the executable
        shell: pwsh
        run: |
          if (-not (Test-Path .\dist\wifi-scanner.exe)) { throw "build produced no exe" }
          .\dist\wifi-scanner.exe --help

      - name: Check the OUI registry is bundled
        shell: pwsh
        run: |
          $bundled = python -c "from PyInstaller.archive.readers import CArchiveReader; print('yes' if 'oui.csv' in CArchiveReader(r'dist/wifi-scanner.exe').toc else 'no')"
          if ($bundled -eq 'yes') {
            Write-Host "dist/wifi-scanner.exe bundles the OUI registry"
          } elseif ($env:GITHUB_REF -like 'refs/tags/v*') {
            throw "release build produced an executable without the bundled OUI registry"
          } else {
            Write-Host "::warning title=OUI registry not bundled::the executable will download the registry on first run instead"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: wifi-scanner-windows-x64
          path: dist/wifi-scanner.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/wifi-scanner.exe
          generate_release_notes: true
